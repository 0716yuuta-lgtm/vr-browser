<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPhone Safari用: セーフエリア対応、誤ズーム防止、アドレスバー最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS ホーム画面追加時の全画面・ステータスバー設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <title>VR Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 通常モード画面 -->
  <div class="container" id="normalContainer">
    <header class="app-header">
      <h1>VR Browser</h1>
      <p class="subtitle">Phase 5: ジャイロ視点移動（DeviceOrientation）</p>
    </header>

    <main class="player-section">
      <!-- 動画表示エリア（iOS Safari用に playsinline と webkit-playsinline を設定） -->
      <div class="video-container" id="videoContainer">
        <video
          id="videoPlayer"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          src="test.mp4">
          お使いのブラウザは動画タグに対応していません。
        </video>
      </div>

      <!-- VRモード開始ボタン -->
      <div class="vr-button-section">
        <button id="vrButton" class="vr-button" type="button">
          🥽 VR MODE（ジャイロ連動）
        </button>
      </div>

      <!-- ステータス・案内メッセージ表示エリア -->
      <div id="statusMessage" class="status-message">
        <p id="statusText">動画を読み込み中...</p>
      </div>

      <!-- 補助機能: ローカル動画の直接選択（PCやスマホから任意の動画をすぐ試せる補助機能） -->
      <div class="file-picker-section">
        <label for="fileInput" class="file-label">
          📁 端末内の動画ファイルを選択して再生
        </label>
        <input type="file" id="fileInput" accept="video/*" class="file-input">
      </div>
    </main>
  </div>

  <!-- VR視聴画面（全画面オーバーレイ） -->
  <div id="vrContainer" class="vr-container" style="display: none;">
    <!-- 左目用表示領域（50%幅） -->
    <div class="vr-eye left-eye" id="leftEyeContainer">
      <div class="vr-screen" id="screenLeft">
        <canvas id="canvasLeft"></canvas>
      </div>
      <!-- 左目用 再生/一時停止 HUDインジケーター -->
      <div class="vr-indicator left-indicator" id="indicatorLeft"></div>
    </div>

    <!-- 左右の境界線（VRゴーグルの中央線ガイド） -->
    <div class="vr-divider"></div>

    <!-- 右目用表示領域（50%幅） -->
    <div class="vr-eye right-eye" id="rightEyeContainer">
      <div class="vr-screen" id="screenRight">
        <canvas id="canvasRight"></canvas>
      </div>
      <!-- 右目用 再生/一時停止 HUDインジケーター -->
      <div class="vr-indicator right-indicator" id="indicatorRight"></div>
    </div>

    <!-- VRモード用UIレイヤー（邪魔にならないよう自動フェード） -->
    <div class="vr-ui-layer" id="vrUiLayer">
      <!-- 上部操作バー -->
      <div class="vr-top-bar">
        <!-- 左上の控えめな EXIT VR ボタン -->
        <button id="exitVrButton" class="exit-vr-button" type="button" aria-label="通常モードに戻る">
          ✕ EXIT VR
        </button>

        <!-- 視点リセットボタン（正面の向きをリセット） -->
        <button id="resetViewButton" class="reset-view-button" type="button" aria-label="視点を正面にリセット">
          🎯 正面リセット
        </button>

        <!-- 操作・センサーステータスヒント -->
        <div class="vr-status-badge" id="vrStatusBadge">
          🧭 ジャイロ準備中
        </div>
      </div>

      <!-- 縦向き時のみ表示される案内（横向き時は自動で非表示） -->
      <div class="vr-portrait-hint">
        📱 スマホを横向きにすると大きく表示されます
      </div>

      <!-- 操作ヒント -->
      <div class="vr-bottom-bar">
        <div class="vr-tap-hint">
          タップ: 再生/停止 | ダブルタップ: 視点リセット
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
