<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- iPhone Safari用: セーフエリア対応、誤ズーム防止、アドレスバー最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS ホーム画面追加時の全画面・ステータスバー設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <title>VR Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 通常モード画面 -->
  <div class="container" id="normalContainer">
    <header class="app-header">
      <h1>VR Browser</h1>
      <p class="subtitle">Phase 5.2: YouTube 左右2画面 & ローカル動画 VRプレイヤー</p>
    </header>

    <main class="player-section">
      <!-- 1. ローカル動画表示エリア（HTML5 Video） -->
      <div class="video-container" id="videoContainer">
        <video
          id="videoPlayer"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          src="test.mp4">
          お使いのブラウザは動画タグに対応していません。
        </video>
      </div>

      <!-- 2. YouTube通常動画表示エリア（YouTube IFrame Player API - 通常画面用1画面） -->
      <div class="youtube-container" id="youtubeContainer" style="display: none;">
        <div id="youtubePlayerWrapper">
          <div id="youtubeIframeNormal"></div>
        </div>
      </div>

      <!-- YouTube URL入力セクション -->
      <section class="youtube-input-section">
        <label for="youtubeUrlInput" class="section-label">📺 YouTube動画を再生</label>
        <div class="input-group">
          <input
            type="text"
            id="youtubeUrlInput"
            placeholder="YouTubeのURL（例: https://www.youtube.com/watch?v=...）"
            class="youtube-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false">
          <button id="loadYoutubeButton" class="youtube-button" type="button">読み込む</button>
        </div>
      </section>

      <!-- VRモード開始ボタン -->
      <div class="vr-button-section" id="vrButtonSection">
        <button id="vrButton" class="vr-button" type="button">
          🥽 2D VR MODE（ローカル動画）
        </button>
      </div>

      <!-- ステータス・案内メッセージ表示エリア -->
      <div id="statusMessage" class="status-message">
        <p id="statusText">動画を読み込み中...</p>
      </div>

      <!-- 補助機能: ローカル動画の直接選択 -->
      <div class="file-picker-section">
        <label for="fileInput" class="file-label">
          📁 端末内の動画ファイルを選択して再生
        </label>
        <input type="file" id="fileInput" accept="video/*" class="file-input">
      </div>
    </main>
  </div>

  <!-- 【LOCAL用】VR視聴画面（全画面左右2画面Canvasオーバーレイ） -->
  <div id="vrContainer" class="vr-container" style="display: none;">
    <!-- 左目用表示領域（50%幅） -->
    <div class="vr-eye left-eye">
      <canvas id="canvasLeft"></canvas>
      <!-- 左目用 再生/一時停止 HUDインジケーター -->
      <div class="vr-indicator left-indicator" id="indicatorLeft"></div>
    </div>

    <!-- 左右の境界線（VRゴーグルの中央線ガイド） -->
    <div class="vr-divider"></div>

    <!-- 右目用表示領域（50%幅） -->
    <div class="vr-eye right-eye">
      <canvas id="canvasRight"></canvas>
      <!-- 右目用 再生/一時停止 HUDインジケーター -->
      <div class="vr-indicator right-indicator" id="indicatorRight"></div>
    </div>

    <!-- VRモード用UIレイヤー（邪魔にならないよう自動フェード） -->
    <div class="vr-ui-layer" id="vrUiLayer">
      <!-- 上部バー -->
      <div class="vr-top-bar">
        <!-- 左上の控えめな EXIT VR ボタン -->
        <button id="exitVrButton" class="exit-vr-button" type="button" aria-label="通常モードに戻る">
          ✕ EXIT VR
        </button>
      </div>

      <!-- 縦向き時のみ表示される案内（横向き時は自動で非表示） -->
      <div class="vr-portrait-hint">
        📱 スマホを横向きにすると大きく表示されます
      </div>

      <!-- 操作ヒント -->
      <div class="vr-bottom-bar">
        <div class="vr-tap-hint">
          画面タップ: 再生 / 一時停止
        </div>
      </div>
    </div>
  </div>

  <!-- 【YOUTUBE用】VR視聴画面（左右50:50分割 YouTube IFrame 2画面オーバーレイ） -->
  <div id="youtubeVrContainer" class="vr-container youtube-vr-container" style="display: none;">
    <!-- 左目用YouTube表示領域（50%幅） -->
    <div class="vr-eye left-eye">
      <div class="youtube-eye-wrapper">
        <div id="youtubeIframeLeft"></div>
      </div>
    </div>

    <!-- 左右の境界線（VRゴーグルの中央線ガイド） -->
    <div class="vr-divider"></div>

    <!-- 右目用YouTube表示領域（50%幅） -->
    <div class="vr-eye right-eye">
      <div class="youtube-eye-wrapper">
        <div id="youtubeIframeRight"></div>
      </div>
    </div>

    <!-- YouTube VRモード用UIレイヤー -->
    <div class="vr-ui-layer" id="youtubeVrUiLayer">
      <div class="vr-top-bar">
        <button id="exitYoutubeVrButton" class="exit-vr-button" type="button" aria-label="通常モードに戻る">
          ✕ EXIT VR
        </button>
      </div>
      <div class="vr-portrait-hint">
        📱 スマホを横向きにすると大きく表示されます
      </div>
    </div>
  </div>

  <!-- YouTube IFrame Player API のスクリプト（非同期読み込み） -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
